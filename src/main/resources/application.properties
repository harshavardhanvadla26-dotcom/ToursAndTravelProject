spring.application.name=TeluskoToursProject

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


#Logging Configuration
# Set the logging level
#INFO keeps framework startup output readable while still showing warnings and errors
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.tours=TRACE

# Specify a custom log file
logging.file.name=src/main/java/com/tours/Logging/app.log

# Set log file size and total log file
logging.logback.rollingpolicy.max-file-size=1000MB
logging.logback.rollingpolicy.total-size-cap=10000MB

# Define log pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %5p - %c{1} - %m%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %5p - %c{1} - %m%n



# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Server Configuration
server.port=8080
server.tomcat.connection-timeout=20s
server.tomcat.max-connections=200
server.tomcat.threads.max=200


